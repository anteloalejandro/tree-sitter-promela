[package]
name = "tree-sitter-promela"
description = "Tree-sitter grammar for the Promela language, used by the Spin verification tool."
version = "0.1.0"
authors = ["Alejandro Antelo <alfasant@protonmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "promela"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/anteloalejandro/tree-sitter-promela"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
